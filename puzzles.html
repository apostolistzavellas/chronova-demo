<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHRONOVA — My Puzzles</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1320;color:#e9edf4;font:15px system-ui,sans-serif}.app{max-width:760px;margin:auto;padding:24px 16px 100px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.brand{font:700 21px Georgia,serif;letter-spacing:3px;color:#eacb8e}a{color:#e8c889;text-decoration:none}h1,h2{font-family:Georgia,serif;color:#f1d499}p{color:#aeb9c9}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.card{display:block;text-align:left;width:100%;padding:0;border:1px solid #826c4a;border-radius:17px;overflow:hidden;background:#18253a;color:inherit;cursor:pointer}.cover{height:175px;display:grid;place-items:center;font-size:85px;background:radial-gradient(circle at 50% 35%,#576079,#202c40 70%);position:relative}.count{position:absolute;right:12px;top:12px;background:#0b1320dd;border:1px solid #a38b60;padding:5px 10px;border-radius:20px;font-size:12px}.info{padding:16px}.info b{font:23px Georgia,serif;color:#f1d499}.info small{display:block;color:#b4bfce;margin:9px 0}.bar{height:7px;background:#354257;border-radius:8px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ad8549,#f1d18a)}button{font:inherit}.back,.add{border:1px solid #a98a57;background:#273449;color:#f2d495;border-radius:10px;padding:10px 13px;cursor:pointer}.back{margin:12px 0}.board{display:grid;gap:3px;background:#967d55;border-radius:12px;padding:4px;aspect-ratio:1;max-width:540px;margin:20px auto}.tile{min-width:0;min-height:0;position:relative;display:grid;place-items:center;background:#172236;color:#75859e;font:24px Georgia,serif}.tile.placed{background:linear-gradient(145deg,#e3c18a,#8d6944);color:#172236}.tile.ready{background:#25483d;color:#efcf8b;box-shadow:inset 0 0 0 2px #dcb876}.tile small{position:absolute;bottom:8px;font:9px system-ui;letter-spacing:1px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid #5e533e;background:#1b2a3e;padding:12px;border-radius:12px;margin:10px 0}.row p{margin:5px 0;font-size:12px}.muted{font-size:13px;color:#aeb9c9}.hidden{display:none!important}.legend{text-align:center;margin-bottom:30px}</style></head><body><div class="app"><header><span class="brand">CHRONOVA</span><a href="./index.html">← Main demo</a></header><button id="back" class="back hidden">← All puzzles</button><h1 id="title">My Puzzles</h1><p id="subtitle">Your historical collections. Select a puzzle to view its fragments.</p><main id="content"></main></div><script>const defs=[{name:'The Parthenon',era:'Classical Greece',emoji:'🏛️',total:9,placed:[1,2,3,4,6,7,9],available:[8]},{name:'The Golden Scarab',era:'Ancient Egypt',emoji:'🪲',total:6,placed:[1,4],available:[2]},{name:'The Colosseum',era:'Roman Empire',emoji:'🏟️',total:12,placed:[1,2,4,5],available:[3]},{name:'Moon Landing',era:'Space Age',emoji:'🌕',total:16,placed:[],available:[]}];let current=-1;const el=id=>document.getElementById(id);function render(){const d=defs[current];el('back').classList.toggle('hidden',!d);el('title').textContent=d?d.name:'My Puzzles';el('subtitle').textContent=d?d.era+' · '+d.placed.length+' / '+d.total+' fragments placed':'Your historical collections. Select a puzzle to view its fragments.';if(!d){el('content').innerHTML='<div class="gallery">'+defs.map((p,i)=>'<button class="card" data-open="'+i+'"><div class="cover">'+p.emoji+'<span class="count">'+p.placed.length+'/'+p.total+'</span></div><div class="info"><b>'+p.name+'</b><small>'+p.era+' · '+Math.round(p.placed.length/p.total*100)+'% complete</small><div class="bar"><i style="width:'+p.placed.length/p.total*100+'%"></i></div></div></button>').join('')+'</div>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{current=+b.dataset.open;render();scrollTo(0,0)});return}const cols=Math.ceil(Math.sqrt(d.total));el('content').innerHTML='<div class="bar"><i style="width:'+d.placed.length/d.total*100+'%"></i></div><div class="board" style="grid-template-columns:repeat('+cols+',1fr)">'+Array.from({length:d.total},(_,i)=>{const n=i+1,placed=d.placed.includes(n),ready=d.available.includes(n);return '<div class="tile '+(placed?'placed':ready?'ready':'')+'">'+(placed?d.emoji:String(n).padStart(2,'0'))+(ready?'<small>READY</small>':'')+'</div>'}).join('')+'</div><p class="muted legend">Gold = placed · Green = available · Dark = missing</p><h2>Available fragments</h2>'+(d.available.length?d.available.map(n=>'<div class="row"><div><b>Fragment '+n+'</b><p>Ready to place</p></div><button class="add" data-add="'+n+'">Add to Puzzle</button></div>').join(''):'<p>No unplaced fragments available yet.</p>')+'<p class="muted">Prototype artwork and sample progress. Fragments are placed automatically.</p>';document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const n=+b.dataset.add;d.available=d.available.filter(x=>x!==n);d.placed.push(n);render()})}el('back').onclick=()=>{current=-1;render()};render();</script></body></html>
